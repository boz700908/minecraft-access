name: Push
on:
  push:
  pull_request:

env:
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
  build-26-2:
    name: Build (26.2)
    # The 26.2 branch keeps its own copy of the mod; every other branch gets both versions built,
    # while a push to that branch is already the 26.2 build itself.
    if: github.event_name == 'push' && github.ref != 'refs/heads/feature/mc-26.2'
    uses: ./.github/workflows/build.yml
    with:
      ref: feature/mc-26.2
      artifactName: minecraft-access-26.2
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Test
        # language=bash
        run: ./gradlew clean test
